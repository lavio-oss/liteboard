services:
  postgres:
    profiles: ['application']
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liteboard}
      POSTGRES_USER: ${POSTGRES_USER:-liteboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liteboard}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - liteboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-liteboard} -d ${POSTGRES_DB:-liteboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - liteboard-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: iegomez/mosquitto-go-auth@sha256:acd65f8566f22126e3bf3b72fe5bee8a5002ca57695f211b1904013953560c3f
    environment:
      MQTT_PG_HOST: ${MQTT_PG_HOST:-host.docker.internal}
      MQTT_PG_PORT: ${MQTT_PG_PORT:-5432}
      MQTT_PG_DB: ${POSTGRES_DB:-liteboard}
      MQTT_PG_USER: ${POSTGRES_USER:-liteboard}
      MQTT_PG_PASSWORD: ${POSTGRES_PASSWORD:-liteboard}
      MQTT_REDIS_HOST: ${MQTT_REDIS_HOST:-redis}
      MQTT_REDIS_PORT: ${MQTT_REDIS_PORT:-6379}
      MQTT_INTERNAL_USERNAME: ${MQTT_INTERNAL_USERNAME:-telemetry-service}
      MQTT_INTERNAL_PASSWORD: ${MQTT_INTERNAL_PASSWORD:-telemetry-service-secret}
      MQTT_HEALTHCHECK_USERNAME: ${MQTT_HEALTHCHECK_USERNAME:-healthcheck}
      MQTT_HEALTHCHECK_PASSWORD: ${MQTT_HEALTHCHECK_PASSWORD:-healthcheck-secret}
      MQTT_TLS_HOSTNAME: ${MQTT_TLS_HOSTNAME:-mqtt.local}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        INTERNAL_HASH=$$(/mosquitto/pw -h bcrypt -c 10 -p "$$MQTT_INTERNAL_PASSWORD")
        HEALTH_HASH=$$(/mosquitto/pw -h bcrypt -c 10 -p "$$MQTT_HEALTHCHECK_PASSWORD")
        printf "%s:%s\n%s:%s\n" "$$MQTT_INTERNAL_USERNAME" "$$INTERNAL_HASH" "$$MQTT_HEALTHCHECK_USERNAME" "$$HEALTH_HASH" > /tmp/mosquitto-passwords
        chmod 0644 /tmp/mosquitto-passwords
        sed \
          -e "s|__MQTT_PG_HOST__|$$MQTT_PG_HOST|g" \
          -e "s|__MQTT_PG_PORT__|$$MQTT_PG_PORT|g" \
          -e "s|__MQTT_PG_DB__|$$MQTT_PG_DB|g" \
          -e "s|__MQTT_PG_USER__|$$MQTT_PG_USER|g" \
          -e "s|__MQTT_PG_PASSWORD__|$$MQTT_PG_PASSWORD|g" \
          -e "s|__MQTT_REDIS_HOST__|$$MQTT_REDIS_HOST|g" \
          -e "s|__MQTT_REDIS_PORT__|$$MQTT_REDIS_PORT|g" \
          /etc/mosquitto/mosquitto.conf.template > /tmp/mosquitto.conf
        chmod 0644 /tmp/mosquitto.conf
        exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf
    ports:
      - '8883:8883'
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf.template:ro
      - ./infrastructure/mosquitto/acls:/etc/mosquitto/auth/acls:ro
      - liteboard-mosquitto-data:/mosquitto/data
      - liteboard-mosquitto-log:/mosquitto/log
    secrets:
      - mqtt_server_certificate
      - mqtt_server_private_key
      - mqtt_tls_ca_certificate
    networks:
      default:
        aliases:
          - ${MQTT_TLS_HOSTNAME:-mqtt.local}
    healthcheck:
      test:
        - CMD-SHELL
        - 'mosquitto_pub --cafile /run/secrets/mqtt_tls_ca_certificate -h "$$MQTT_TLS_HOSTNAME" -p 8883 -u "$$MQTT_HEALTHCHECK_USERNAME" -P "$$MQTT_HEALTHCHECK_PASSWORD" -t healthcheck -n'
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy

  backend:
    profiles: ['application']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: LiteBoard
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:ZmFrZS1saXRlYm9hcmQta2V5LWZvci1sb2NhbC1kZXY=}
      APP_DEBUG: '${APP_DEBUG:-true}'
      APP_URL: http://localhost:8800
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-liteboard}
      DB_USERNAME: ${POSTGRES_USER:-liteboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-liteboard}
      SESSION_DRIVER: database
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_PROVISIONING_MQTT_HOST: ${DEVICE_PROVISIONING_MQTT_HOST:-mqtt.local}
      DEVICE_PROVISIONING_IP_RATE_LIMIT: ${DEVICE_PROVISIONING_IP_RATE_LIMIT:-30}
      DEVICE_PROVISIONING_PROFILE_RATE_LIMIT: ${DEVICE_PROVISIONING_PROFILE_RATE_LIMIT:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
    ports:
      - '${BACKEND_PORT:-8800}:8800'
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8800/api/health') === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telemetry-service:
    build:
      context: telemetry-service
    environment:
      MQTT_HOST: ${MQTT_TLS_HOSTNAME:-mqtt.local}
      MQTT_PORT: 8883
      MQTT_TLS_CA_FILE: /run/secrets/mqtt_tls_ca_certificate
      MQTT_USERNAME: ${MQTT_INTERNAL_USERNAME:-telemetry-service}
      MQTT_PASSWORD: ${MQTT_INTERNAL_PASSWORD:-telemetry-service-secret}
      DB_HOST: ${MQTT_PG_HOST:-host.docker.internal}
      DB_PORT: ${MQTT_PG_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB:-liteboard}
      DB_USERNAME: ${POSTGRES_USER:-liteboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-liteboard}
    ports:
      - '${TELEMETRY_PORT:-8100}:8100'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      mosquitto:
        condition: service_healthy
    secrets:
      - mqtt_tls_ca_certificate

  frontend:
    profiles: ['application', 'containerized-frontend']
    build:
      context: web
    environment:
      NUXT_LARAVEL_API_BASE: http://backend:8800
    volumes:
      - ${MQTT_TLS_CA_SOURCE:-./infrastructure/mosquitto/certs/ca.crt}:/app/public/mqtt/ca.txt:ro
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    build:
      context: simulator
    environment:
      DEVICE_CONNECTION_MODE: ${SIMULATOR_CONNECTION_MODE:-manual}
      DEVICE_STATE_FILE: /var/lib/liteboard/device.json
      DEVICE_PROVISIONING_URL: ${DEVICE_PROVISIONING_URL:-https://provisioning.example.invalid/api/device-provisioning/bootstrap}
      DEVICE_PROVISIONING_CA_FILE: /run/secrets/device_provisioning_ca_certificate
      PROVISION_KEY: ${SIMULATOR_PROVISION_KEY:-}
      PROVISION_SECRET: ${SIMULATOR_PROVISION_SECRET:-}
      DEVICE_NAME: ${SIMULATOR_DEVICE_NAME:-LiteBoard simulator}
      DEVICE_CODE: ${SIMULATOR_DEVICE_CODE:-simulator-001}
      FIRMWARE_VERSION: ${SIMULATOR_FIRMWARE_VERSION:-simulator}
      MQTT_HOST: ${MQTT_TLS_HOSTNAME:-mqtt.local}
      MQTT_PORT: 8883
      MQTT_TLS_CA_FILE: /run/secrets/mqtt_tls_ca_certificate
      PROJECT_ID: ${SIMULATOR_PROJECT_ID:-}
      DEVICE_ID: ${SIMULATOR_DEVICE_ID:-}
      DEVICE_ACCESS_TOKEN: ${SIMULATOR_DEVICE_ACCESS_TOKEN:-}
    profiles: ['tools']
    volumes:
      - liteboard-simulator-state:/var/lib/liteboard
    depends_on:
      mosquitto:
        condition: service_healthy
    secrets:
      - mqtt_tls_ca_certificate
      - device_provisioning_ca_certificate

volumes:
  liteboard-postgres:
  liteboard-redis:
  liteboard-mosquitto-data:
  liteboard-mosquitto-log:
  liteboard-simulator-state:

secrets:
  mqtt_server_certificate:
    file: ${MQTT_TLS_CERT_FILE:-./infrastructure/mosquitto/certs/broker/server.crt}
  mqtt_server_private_key:
    file: ${MQTT_TLS_KEY_FILE:-./infrastructure/mosquitto/certs/broker/server.key}
  device_provisioning_ca_certificate:
    file: ${DEVICE_PROVISIONING_CA_FILE:-./infrastructure/provisioning/ca.crt}
  mqtt_tls_ca_certificate:
    file: ${MQTT_TLS_CA_SOURCE:-./infrastructure/mosquitto/certs/ca.crt}
