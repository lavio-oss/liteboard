# Copy to /etc/sysctl.d/ and run `sysctl --system`.
# Many long-lived MQTT device connections plus nginx/websocket clients.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
fs.file-max = 1048576
net.ipv4.ip_local_port_range = 10240 65535
# Detect dead devices (power loss, NAT drop) in ~6 min instead of 2h+.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
