persistence false
log_dest stdout

per_listener_settings false
allow_anonymous false

max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 67108864
max_packet_size 65536

# Public plaintext playground. Access Tokens travel unencrypted here.
# Devices authenticate against the same views as the TLS broker, but only when
# devices.allow_plaintext is true. Accepted traffic is bridged to the
# TLS broker, so ingestion and the ACLs on that broker stay unchanged.
listener 1883 0.0.0.0
protocol mqtt
max_connections 1000

connection plaintext-bridge
address __MQTT_TLS_HOSTNAME__:8883
bridge_cafile /run/secrets/mqtt_tls_ca_certificate
bridge_tls_version tlsv1.2
bridge_protocol_version mqttv311
remote_username __MQTT_BRIDGE_USERNAME__
remote_password __MQTT_BRIDGE_PASSWORD__
cleansession true
topic liteboard/+/devices/+/telemetry out 1
topic liteboard/+/devices/+/heartbeat out 1
topic liteboard/+/devices/+/commands/ack out 1
topic liteboard/+/devices/+/commands in 1

auth_plugin /mosquitto/go-auth.so
auth_opt_backends postgres
auth_opt_check_prefix false
auth_opt_disable_superuser true
auth_opt_log_level info
auth_opt_log_dest stdout

auth_opt_hasher bcrypt
auth_opt_hasher_cost 10

auth_opt_pg_host __MQTT_PG_HOST__
auth_opt_pg_port __MQTT_PG_PORT__
auth_opt_pg_dbname __MQTT_PG_DB__
auth_opt_pg_user __MQTT_PG_USER__
auth_opt_pg_password __MQTT_PG_PASSWORD__
auth_opt_pg_sslmode disable
auth_opt_pg_userquery SELECT u.mqtt_password_hash FROM v_mqtt_users u JOIN devices d ON d.id = u.device_id WHERE u.token_hash = encode(sha256(convert_to($1, 'UTF8')), 'hex') AND d.allow_plaintext LIMIT 1
auth_opt_pg_aclquery SELECT a.topic FROM v_mqtt_acls a JOIN v_mqtt_users u ON u.token_hash = a.token_hash JOIN devices d ON d.id = u.device_id WHERE a.token_hash = encode(sha256(convert_to($1, 'UTF8')), 'hex') AND a.rw = $2 AND d.allow_plaintext

# Short-TTL cache keeps the flag change effective within seconds.
auth_opt_cache true
auth_opt_cache_type redis
auth_opt_cache_reset true
auth_opt_cache_refresh false
auth_opt_cache_host __MQTT_REDIS_HOST__
auth_opt_cache_port __MQTT_REDIS_PORT__
auth_opt_cache_db 1
auth_opt_auth_cache_seconds 5
auth_opt_acl_cache_seconds 5
