persistence true
persistence_location /mosquitto/data/
log_dest stdout

per_listener_settings false
allow_anonymous false

# Keep persistent-session delivery bounded during a telemetry consumer outage.
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 67108864

# The broker exposes MQTT only over TLS. Clients verify this server certificate;
# cafile/require_certificate are intentionally omitted because this is not mTLS.
listener 8883 0.0.0.0
protocol mqtt
certfile /run/secrets/mqtt_server_certificate
keyfile /run/secrets/mqtt_server_private_key
tls_version tlsv1.2

auth_plugin /mosquitto/go-auth.so
auth_opt_backends files, postgres
auth_opt_check_prefix false
auth_opt_exhaust_backend_first true
auth_opt_disable_superuser true
auth_opt_log_level info
auth_opt_log_dest stdout

# Password hashing (bcrypt for both files and postgres backends)
auth_opt_hasher bcrypt
auth_opt_hasher_cost 10

# 1. Static files backend (passwords generated at runtime into /tmp/mosquitto-passwords)
auth_opt_files_password_path /tmp/mosquitto-passwords
auth_opt_files_acl_path /etc/mosquitto/auth/acls

# 2. PostgreSQL backend (IoT devices authenticated via Access Token)
auth_opt_pg_host __MQTT_PG_HOST__
auth_opt_pg_port __MQTT_PG_PORT__
auth_opt_pg_dbname __MQTT_PG_DB__
auth_opt_pg_user __MQTT_PG_USER__
auth_opt_pg_password __MQTT_PG_PASSWORD__
auth_opt_pg_sslmode disable
auth_opt_pg_userquery SELECT mqtt_password_hash FROM v_mqtt_users WHERE token_hash = encode(sha256(convert_to($1, 'UTF8')), 'hex') LIMIT 1
auth_opt_pg_aclquery SELECT topic FROM v_mqtt_acls WHERE token_hash = encode(sha256(convert_to($1, 'UTF8')), 'hex') AND rw = $2

# 3. Redis short-TTL cache (5 seconds) for high-frequency telemetry
auth_opt_cache true
auth_opt_cache_type redis
auth_opt_cache_reset true
auth_opt_cache_refresh false
auth_opt_cache_host __MQTT_REDIS_HOST__
auth_opt_cache_port __MQTT_REDIS_PORT__
auth_opt_auth_cache_seconds 5
auth_opt_acl_cache_seconds 5
