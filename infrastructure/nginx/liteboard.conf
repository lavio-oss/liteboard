# Host nginx for a single-VPS LiteBoard deployment (docs/setup/production.md).
# Replace app.example.com, then: ln -s this file into /etc/nginx/sites-enabled/.
# MQTT (8883 TLS, 1883 plaintext) does NOT go through nginx: Mosquitto listens directly.

upstream liteboard_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream liteboard_telemetry {
    server 127.0.0.1:8100;
}

upstream liteboard_php {
    server 127.0.0.1:9000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:liteboard_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/internal/ {
        return 403;
    }

    # Devices call provisioning directly; skip the Nuxt hop.
    location /api/device-provisioning/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_keep_conn on;
        fastcgi_pass liteboard_php;
    }

    location /ws/ {
        proxy_pass http://liteboard_telemetry;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The CA is mounted into the dev container; in production nginx serves it.
    location = /mqtt/ca.txt {
        alias /etc/liteboard/mqtt-ca.crt;
        default_type text/plain;
    }

    location /_nuxt/ {
        proxy_pass http://liteboard_web;
        proxy_set_header Connection '';
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://liteboard_web;
        proxy_set_header Connection '';
    }
}

# Loopback-only Laravel entry for Nuxt SSR and telemetry-service (includes /api/internal/).
server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 2m;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Callers reached us from an HTTPS origin; keeps generated URLs https.
        fastcgi_param HTTPS on;
        fastcgi_keep_conn on;
        fastcgi_pass liteboard_php;
    }
}
